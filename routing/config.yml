graphhopper:
  datareader.file: /data/hatay.osm.pbf
  graph.location: /data/graph-cache

  profiles:
    - name: car
      custom_model_files: [car.json]

  profiles_ch:
    - profile: car

  profiles_lm: []

  graph.encoded_values: |
    car_access, car_average_speed, road_access, country, road_class, roundabout, max_speed, road_environment,
    ferry_speed

  import.osm.ignored_highways: ''
  graph.dataaccess.default_type: RAM_STORE
  prepare.min_network_size: 100
  routing.max_visited_nodes: 1000000
  routing.timeout_ms: 15000
  routing.non_ch.max_waypoint_distance: 200000

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 0.0.0.0

logging:
  level: INFO
  appenders:
    - type: console
      time_zone: Europe/Istanbul
